<style>

:root{--ink:#152b32;--muted:#647277;--orange:#bf4b26;--paper:#f6f5ef;--line:#dadfd9;--green:#326c57}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:30px}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,'Malgun Gothic',sans-serif;line-height:1.7}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}a{color:inherit;text-underline-offset:4px}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #cf6a28;outline-offset:4px}header{height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 5%;border-bottom:1px solid var(--line);background:#fffefa}.brand{display:flex;gap:12px;align-items:center;font-weight:800;font-size:15px}.mark{width:35px;height:35px;background:var(--ink);color:white;display:grid;place-items:center;border-radius:10px;font-size:19px}.edition{font-size:12px;color:var(--muted);letter-spacing:.07em}.layout{max-width:1250px;margin:0 auto;display:grid;grid-template-columns:240px minmax(0,1fr);gap:65px;padding:48px 32px 100px}aside{position:sticky;top:30px;align-self:start}.nav-label{font-size:11px;letter-spacing:.16em;color:var(--muted);margin-bottom:20px;font-weight:bold}nav{display:grid;gap:6px}nav a{text-decoration:none;padding:12px 14px;display:flex;gap:12px;border-radius:8px;font-size:13px;font-weight:600;align-items:center}nav a span{font-size:11px;color:var(--muted);font-weight:400}nav a:hover,nav a.active{background:#e7ebe4}nav a.active{box-shadow:inset 3px 0 var(--orange)}.side-note{margin:30px 14px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:20px}.eyebrow{color:var(--orange);font-size:12px;letter-spacing:.15em;font-weight:700;margin:0 0 18px}h1{font-size:clamp(32px,4vw,49px);line-height:1.3;letter-spacing:-.06em;margin:0 0 20px;font-weight:800}.intro{color:var(--muted);font-size:15px;margin:0;word-break:keep-all}.hero{padding:8px 0 33px}.meta{display:flex;gap:20px;margin-top:25px;font-size:12px;color:var(--muted)}.meta strong{color:var(--ink)}.how{background:var(--ink);color:#fff;border-radius:13px;padding:22px 25px;margin-bottom:40px;display:flex;gap:23px;align-items:center}.how b{font-size:14px;white-space:nowrap}.how p{font-size:13px;margin:0;color:#d2dedb}.how em{font-style:normal;color:#ebba91}.exercise{margin:0 0 42px;scroll-margin-top:25px}.section-head{display:flex;align-items:center;gap:14px;margin-bottom:12px}.number{color:var(--orange);font-size:14px;font-weight:800;border:1px solid #d6c5b7;width:37px;height:37px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}h2{font-size:21px;letter-spacing:-.04em;line-height:1.4;margin:0}.hint{font-size:13px;color:var(--muted);margin:0 0 18px;word-break:keep-all}.card{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:12px 0;box-shadow:0 3px 8px #152b3203}.card-head{padding:14px 19px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #edf0ec}.step-label{background:#edf0ea;font-size:11px;letter-spacing:.04em;font-weight:800;border-radius:5px;padding:3px 8px}.step-name{font-size:13px;font-weight:600}.copy{margin-left:auto;background:var(--ink);border:0;color:white;padding:9px 15px;border-radius:7px;font-size:12px;min-height:42px;white-space:nowrap}.copy:hover{background:#2b4851}.copy.done{background:var(--green)}pre{white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;margin:0;padding:22px;font:14px/1.95 Arial,'Malgun Gothic',sans-serif;color:#35474c;user-select:text}.long pre{max-height:270px;overflow:hidden}.expand{border:0;border-top:1px solid #edf0ec;background:#fafbf8;width:100%;padding:11px;color:var(--muted);font-size:12px;min-height:44px}.asset{border:1px dashed #b9c4ba;background:#edf1ea;border-radius:10px;padding:18px;margin:18px 0}.asset-label{font-size:11px;color:var(--green);font-weight:800;letter-spacing:.1em}.asset-row{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:6px 0}.asset-title{font-size:14px;font-weight:bold}.asset a{font-size:12px}.asset details{font-size:13px;color:var(--muted)}summary{cursor:pointer;min-height:38px;padding-top:6px}.asset img{display:block;width:100%;height:auto;background:#fff;margin-top:12px;border-radius:4px}.asset small{font-size:12px;color:var(--muted)}.bottom{border-top:1px solid var(--line);padding-top:26px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:15px}.bottom a{font-weight:bold}.toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:white;border-radius:9px;padding:12px 23px;box-shadow:0 5px 25px #0002;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:10;max-width:90vw;text-align:center}.toast.visible{opacity:1;transform:translate(-50%,0)}dialog{border:1px solid var(--line);border-radius:14px;max-width:520px;width:90vw;padding:24px;color:var(--ink)}dialog::backdrop{background:#152b3280}dialog textarea{width:100%;height:220px;font:14px/1.7 sans-serif;padding:12px;margin:12px 0}dialog button{background:var(--ink);color:white;border:0;border-radius:7px;padding:10px 20px}footer{text-align:center;font-size:11px;color:#7c8886;padding:22px;border-top:1px solid var(--line)}
@media(max-width:820px){header{height:65px;padding:0 20px}.edition{font-size:10px}.layout{display:block;padding:0 20px 55px}aside{position:sticky;top:0;background:var(--paper);z-index:5;margin:0 -20px;padding:12px 20px;border-bottom:1px solid var(--line)}.nav-label,.side-note{display:none}nav{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}nav a{flex:none;padding:8px 14px;font-size:12px;border:1px solid var(--line);border-radius:7px;background:#fffefa}nav a span{display:none}nav a.active{background:var(--ink);color:white;box-shadow:none}.hero{padding:33px 0 26px}h1{font-size:35px}.meta{gap:15px}.how{display:block;padding:19px 20px;margin-bottom:30px}.how b{display:block;margin-bottom:7px}.exercise{scroll-margin-top:85px;margin-bottom:35px}h2{font-size:19px}.card-head{padding:12px;gap:7px}.step-name{font-size:12px}.copy{padding:9px 12px}pre{padding:18px;font-size:14px}.asset-row{align-items:flex-start}.asset-title{font-size:13px}.asset a{white-space:nowrap}.bottom{display:block}.bottom a{display:inline-block;margin-top:10px}.toast{bottom:20px;min-width:230px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.toast{transition:none}}

.asset+.asset{margin-top:10px}
.sites{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:-22px 0 40px}

.site-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;text-decoration:none;color:var(--ink);border:1px solid #b9c4ba;background:#fff;border-radius:999px;padding:7px 14px}
.site-link:hover{border-color:var(--green);color:var(--green)}

<body id="top">
<div class="layout"><aside><div class="nav-label">PRACTICE INDEX</div><nav aria-label="실습 바로가기" id="nav"></nav><div class="side-note" id="sidenote"></div></aside>
<main><section class="hero"><p class="eyebrow">AI PRACTICE WORKSHOP</p><h1>복사해서 바로 쓰는<br>업무 AI 실습.</h1><p class="intro">강의에 맞춰 프롬프트를 복사하고<br>AI 대화창에 붙여넣어 직접 실습해 보세요.</p></section>
<div class="how"><b>이렇게 따라 하세요 ↗</b><p><em>프롬프트 복사</em> → AI 대화창에 붙여넣기 → 결과 확인<br>#1, #2, #3은 같은 대화에서 차례대로 입력하세요.</p></div><div class="sites" id="sites"></div>
<div id="exercises"></div><div class="bottom"><span>모든 프롬프트는 제공된 강의 자료를 기준으로 구성했습니다.</span><a href="#top">맨 위로 ↑</a></div></main></div>
<footer>AI 활용 실습</footer>

<dialog id="manual"><strong>프롬프트 직접 복사</strong><p>복사 권한을 사용할 수 없습니다. 아래 내용을 길게 눌러 복사하세요.</p><textarea readonly aria-label="복사할 프롬프트"></textarea><button type="button">닫기</button></dialog>
<script>
const exercises=[{"id": 0, "title": "업무를 위한 Gemini 요청사항", "short": "Gemini 요청사항", "hint": "아래 프롬프트를 복사해 AI 대화창에 입력하세요.", "steps": [{"label": "PROMPT", "name": "실습 프롬프트", "text": "검색 후 출처 기반의 설명 \n고급 수준의 전문적 설명 \n모호한 질문에는 보류 또는 추가 질문 요청"}], "assets": [], "links": [{"name": "Gemini", "url": "https://gemini.google.com/"}]}, {"id": 1, "title": "자료 요약/번역/검색", "short": "요약/번역/검색", "hint": "실습 자료를 먼저 첨부하고, 같은 대화에서 순서대로 입력하세요.", "steps": [{"label": "#1", "name": "", "text": "위의 PDF 내용을 잘 이해해줘"}, {"label": "#2", "name": "", "text": "위 PDF에서 소방업무 영역에서 AI로 대체 가능한 업무영역에 대해 알려줘"}, {"label": "#3", "name": "", "text": "첨부의 내용을 소방공무원에게 요구되는 업무 및 역할 변화와 \n그에 따른 대응방안'을 3000자 이내 개조식으로 작성해줘 "}], "assets": [{"key": "", "title": "1. WEF_Jobs_of_Tomorrow_Generative_AI_2023.pdf", "filename": "1. WEF_Jobs_of_Tomorrow_Generative_AI_2023.pdf"}], "links": [{"name": "Gemini", "url": "https://gemini.google.com/"}]}, {"id": 2, "title": "보도자료 작성", "short": "보도자료 작성", "hint": "실습 자료를 먼저 첨부하고, 같은 대화에서 순서대로 입력하세요.", "steps": [{"label": "#1", "name": "", "text": "당신은 보도자료 작성에 탁월한 기자로서, 저와 함께 기사를 작성할 것입니다. \n먼저 보도자료 샘플을 1개 보여드리니, 이 문체를 잘 기억해주십시오. \n (보도자료 샘플 제시)"}, {"label": "#2", "name": "", "text": "이건 내가 쓴 보도자료 초안인데, 샘플의 스타일을 적용해서 수정해주십시오. \n만일 당신이 보도자료 작성하는데 필요한 추가정보가 있다면 나에게 요청해도 됩니다.\n교육과정 명: 제46기 소방위 관리역량과정\n교육기간: 2026. 11. 23.(월) ~ 11. 25.(수)\n교육장소: 충청소방학교 청양청사 본관 \n교육내용: MZ세대의 소통과 이해, 산림화재, 재난현장 표준작전절차, AI시대 리더십, 펌블런스 책임 역할 및 안전조치"}], "assets": [{"key": "", "title": "2. 보도자료 샘플.pdf", "filename": "2. 보도자료 샘플.pdf"}], "links": [{"name": "Gemini", "url": "https://gemini.google.com/"}]}, {"id": 3, "title": "새로운 업무를 위한 프롬프트", "short": "새 업무 프롬프트", "hint": "아래 프롬프트를 복사해 AI 대화창에 입력하세요.", "steps": [{"label": "PROMPT", "name": "실습 프롬프트", "text": "당신은 소방관리 업무를 지원하는 AI Agent다. \n\n내가 ‘ㅇㅇㅇ' 업무를 하기 위해 Gemini에 어떻게 프롬프트를 입력하면 좋을 지, 프롬프트 예시를 제시하시오. "}], "assets": [], "links": [{"name": "Gemini", "url": "https://gemini.google.com/"}]}, {"id": 4, "title": "Deep Research", "short": "Deep Research", "hint": "아래 프롬프트를 복사해 AI 대화창에 입력하세요.", "steps": [{"label": "PROMPT", "name": "실습 프롬프트", "text": "‘소방안전업무에서 생성형 AI 활용방안’에 대한 심층 연구보고서를 작성하시오. \n소방공무원이 실제 업무에 적용할 수 있는 실무 중심으로 국내외 최신 동향과 실제 활용사례, 소방업무 분야별 구체적인 활용방안, 기대효과, 위험요인 및 대응방안, 단계별 실행전략을 포함하시오."}], "assets": [], "links": [{"name": "Gemini", "url": "https://gemini.google.com/"}]}, {"id": 5, "title": "소방법 설명봇", "short": "소방법 설명봇", "hint": "실습 자료를 먼저 첨부하고, 아래 프롬프트를 입력하세요.", "steps": [{"label": "PROMPT", "name": "실습 프롬프트", "text": "너는 소방법을 소방공무원 및 민원인들에게 정확히 설명하는 법령 안내 챗봇이다.\n\n1. 설명 원칙\n- 반드시 첨부파일을 기준으로 설명하며, 자의적 해석을 하지 않는다.\n- 용어 정의, 제도 취지, 의무사항, 위반 시 제재 등을 실제 매뉴얼 문구를 기반으로 안내한다.\n- 단순 요약이 아닌 이해하기 쉬운 구조(정의 → 주요 내용 → 적용 범위 → 예시 → 주의사항)로 설명한다.\n\n2. 말투 및 형식\n- 공직자를 대상으로 한 공식적이고 정중한 말투를 사용\n- 용어는 반드시 매뉴얼에 명시된 원어를 기준으로 한다. \n- 문장은 2~3문장 단위로 간결하게 구분\n- 개념 설명 후, 자주 묻는 질문 형태로 Q&A를 제공하면 이해가 용이함\n\n3. 설명 구조 템플릿\n[정의]  \n해당 개념 또는 제도의 명확한 정의를 제공합니다.\n[관련 조항 및 기준]  \n법령 상 근거 조항, 또는 매뉴얼 기준 항목을 명시합니다.\n[적용 범위 및 대상]  \n어떤 상황과 누구에게 적용되는지를 설명합니다.\n[예시 또는 주의사항]  \n실무 예시를 들어 설명하거나, 주의해야 할 부분을 안내합니다.\n\n4. 주의사항\n- 법령 외 추론 시 반드시 출처 표기, 없으면 “일반 원칙”으로 한정.\n- 사실 미확인 정보 단정 금지.\n- 참고 안내 문구 포함: 모든 답변에는 반드시 아래 안내문을 덧붙암\n※ 참고용 안내: 본 답변은 제공된 문서를 기반으로 한 참고 정보입니다. 정확하고 최신의 법적 해석이나 적용은 반드시 관련부처에 문의하시거나 공식 자료를 확인하십시오.\n- 정확한 답변이 어려운 경우 “소방청에 문의하시기 바랍니다” 등의 문구 제시하며 사용자로 하여금 응답을 절대적인 사실로 신뢰하지 않도록 명확히 안내"}], "assets": [{"key": "", "title": "5-1, 5-2, 5-3", "filename": "5-1, 5-2, 5-3"}], "links": [{"name": "Gemini Notebook", "url": "https://notebook.google.com/"}]}];
const ASSETS={};
const SITES=[{"name": "Gemini", "url": "https://gemini.google.com/"}, {"name": "Gemini Notebook", "url": "https://notebook.google.com/"}, {"name": "미리캔버스", "url": "https://www.miricanvas.com/ko"}];
const $=s=>document.querySelector(s);const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const promptCount=exercises.reduce((n,e)=>n+e.steps.length,0);
$('#sidenote').innerHTML=`강의 순서에 맞춰<br>하나씩 따라 해보세요.<br><br>${exercises.length}개 실습 · ${promptCount}개 프롬프트`;
$('#nav').innerHTML=exercises.map((e,i)=>`<a href="#practice-${e.id}" ${i===0?'class="active" aria-current="location"':''}><span>${String(e.id).padStart(2,'0')}</span>실습 ${e.id}${(e.short||e.title)===`실습 ${e.id}`?'':' · '+escapeHTML(e.short||e.title)}</a>`).join('');
function assetBlock(e){return (e.assets||[]).map(a=>{const src=ASSETS[a.key];if(!src)return `<div class="asset"><span class="asset-label">PRACTICE MATERIAL</span><div class="asset-row"><span class="asset-title">${escapeHTML(a.title)}</span></div><small>강사가 안내한 파일을 AI 대화창에 첨부하세요.</small></div>`;return `<div class="asset"><span class="asset-label">PRACTICE MATERIAL</span><div class="asset-row"><span class="asset-title">${escapeHTML(a.title)}</span><a href="${src}" download="${escapeHTML(a.filename)}">이미지 저장 ↓</a></div><small>이미지를 저장한 뒤 AI 대화창에 첨부하세요.</small><details><summary>실습 이미지 펼쳐보기</summary><a href="${src}" target="_blank" rel="noopener"><img src="${src}" alt="${escapeHTML(a.title)}" loading="lazy"></a></details></div>`;}).join('');}
const siteLink=s=>`<a class="site-link" href="${escapeHTML(s.url)}" target="_blank" rel="noopener">${escapeHTML(s.name)} 바로가기 ↗</a>`;
if(SITES.length){$('#sites').innerHTML=`<b>실습 사이트</b>${SITES.map(siteLink).join('')}`;}else{$('#sites').remove();}
function linkBlock(e){return (e.links&&e.links.length)?`<div class="ex-links">${e.links.map(siteLink).join('')}</div>`:'';}
$('#exercises').innerHTML=exercises.map(e=>`<section class="exercise" id="practice-${e.id}"><div class="section-head"><span class="number">${String(e.id).padStart(2,'0')}</span><h2>${escapeHTML(e.title)}</h2></div>${e.hint?`<p class="hint">${escapeHTML(e.hint)}</p>`:''}${linkBlock(e)}${assetBlock(e)}${e.steps.map((p,i)=>`<article class="card ${p.text.length>1000?'long':''}"><div class="card-head"><span class="step-label">${escapeHTML(p.label)}</span>${p.name?`<span class="step-name">${escapeHTML(p.name)}</span>`:''}<button class="copy" data-exercise="${e.id}" data-step="${i}" aria-label="실습 ${e.id} ${escapeHTML(p.label)} 프롬프트 복사">복사하기 ⧉</button></div><pre>${escapeHTML(p.text)}</pre>${p.text.length>1000?'<button class="expand" aria-expanded="false">전문 펼쳐보기 ↓</button>':''}</article>`).join('')}</section>`).join('');
let toastTimer;function toast(message){$('#toast').textContent=message;$('#toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('visible'),2400);}
async function copyText(text){if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(text);return true;}catch{}}const box=document.createElement('textarea');box.value=text;box.style.cssText='position:fixed;top:0;left:-9999px';document.body.append(box);box.focus();box.select();box.setSelectionRange(0,text.length);let success=false;try{success=document.execCommand('copy');}catch{}box.remove();return success;}
document.addEventListener('click',async event=>{const button=event.target.closest('.copy');if(button){const exercise=exercises.find(e=>String(e.id)===button.dataset.exercise);const step=exercise.steps[Number(button.dataset.step)];if(await copyText(step.text)){button.textContent='복사 완료 ✓';button.classList.add('done');toast(`실습 ${exercise.id} ${step.label==='PROMPT'?'':step.label+' '}프롬프트를 복사했습니다.`);setTimeout(()=>{button.textContent='복사하기 ⧉';button.classList.remove('done');},2200);button.focus({preventScroll:true});}else{const dialog=$('#manual');dialog.querySelector('textarea').value=step.text;dialog.showModal();dialog.querySelector('textarea').select();}}const expand=event.target.closest('.expand');if(expand){const collapsed=expand.closest('.card').classList.toggle('long');expand.setAttribute('aria-expanded',String(!collapsed));expand.textContent=collapsed?'전문 펼쳐보기 ↓':'전문 접기 ↑';}});
$('#manual button').onclick=()=>$('#manual').close();
const observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);if(visible.length){document.querySelectorAll('nav a').forEach(a=>{const active=a.hash==='#'+visible[0].target.id;a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current');});}},{rootMargin:'-15% 0px -55% 0px',threshold:0});document.querySelectorAll('.exercise').forEach(e=>observer.observe(e));
</script>
</body></html>
